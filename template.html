<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f1e7">
<title>很高興認識你 Nice to meet you</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--a:#ffb020;--b:#ff7a00;--g:#ffc94d}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;background:radial-gradient(circle at 50% 40%,#2a2620,#0e0d0b 70%) fixed;overflow-x:hidden}
.scr{min-height:100%;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);position:relative}
.hidden{display:none!important}
h1{text-align:center;margin:6px 0 2px;font-size:30px;font-weight:900}
h2{font-size:14px;letter-spacing:2px;margin:22px 0 10px;opacity:.6}
.sub{text-align:center;opacity:.6;margin:0}
.panel{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:22px;padding:14px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:800;margin:10px 0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 0 24px #ffa50055;font-family:inherit}
.btn:active,.deck:active,.stepper button:active,.chip:active{transform:scale(.95)}
.btn.sec{background:#ffffff14;box-shadow:none;font-size:16px;border:1px solid #ffffff22;padding:14px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px}
.stepper button{width:62px;height:62px;border-radius:50%;border:0;font-size:30px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.stepper span{font-size:42px;font-weight:900;min-width:60px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
input,textarea{width:100%;font-size:17px;padding:13px;border-radius:14px;border:1px solid #ffffff26;background:#ffffff10;color:#fff;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
input::placeholder,textarea::placeholder{color:#ffffff66}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{padding:16px 8px;border-radius:20px;background:#ffffff0d;font-size:16px;font-weight:800;border:2px solid #ffffff1a;text-align:center;transition:all .2s}
.deck b{display:block;font-size:34px;margin-bottom:6px}.deck small{display:block;opacity:.65;font-weight:400;margin-top:2px;font-size:13px}
.deck.on{border-color:var(--g);box-shadow:0 0 22px #ffb02066;background:#ffb0201f}
.deck:last-child:nth-child(odd){grid-column:span 2}
/* wheel */
.wrap{position:relative;width:min(86vw,340px);aspect-ratio:1;margin:40px auto 0}
.ptr{position:absolute;top:-16px;left:50%;margin-left:-16px;border:16px solid transparent;border-top:30px solid var(--g);filter:drop-shadow(0 0 8px #ffb020);z-index:2}
#wheel{display:block;width:100%;height:100%;overflow:visible}.wrap::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 6px #ffc94d55,0 0 40px #ffb02077;pointer-events:none}
.hub{position:absolute;top:50%;left:50%;width:72px;height:72px;margin:-36px;border-radius:50%;background:#1a1814;border:3px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:30px}
.res{text-align:center;margin-top:34px;font-size:22px;font-weight:800;min-height:40px}.res b{color:var(--g);font-size:30px}
/* game */
.top{text-align:center}.who{font-size:26px;font-weight:900}.who b{color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff22;font-size:15px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;font-weight:800;box-shadow:0 0 16px #ffa50088}
.chip i{font-style:normal;margin-left:6px;opacity:.85}
.stage{position:relative;height:290px;margin-top:24px;overflow:visible;perspective:900px;touch-action:none}
.frame{position:absolute;top:12px;left:50%;width:180px;height:244px;margin-left:-90px;border-radius:24px;border:2px solid var(--g);box-shadow:0 0 30px #ffb02088,inset 0 0 20px #ffb02044;pointer-events:none}
.c{position:absolute;top:29px;left:50%;width:154px;height:210px;margin-left:-77px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 14px 30px #000a;will-change:transform}
.c .e{font-size:50px}.c .n{font-size:18px;margin-top:8px}.c .s{font-size:12px;opacity:.85;margin-top:4px}
.c.mid{box-shadow:0 0 34px #ffb020aa,0 14px 30px #000a}
.arr{text-align:center;font-size:24px;color:var(--g);margin-top:2px;animation:nud 1.4s infinite}@keyframes nud{50%{transform:translateY(6px)}}
.slot{position:relative;width:200px;height:110px;margin:6px auto 0;border-radius:20px;border:1.5px solid #ffffff30;background:linear-gradient(#ffffff08,#ffffff02);overflow:hidden}
.slot::after{content:"";position:absolute;left:20px;right:20px;bottom:-30px;height:60px;border-radius:50%;background:var(--a);filter:blur(22px);opacity:.75;transition:opacity .3s}
.slot.hot::after{opacity:1;background:#ffe08a}
.cnt{text-align:center;opacity:.6;font-size:14px;margin:12px 0 4px}
/* reveal */
.ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#2a2620f2,#0e0d0bfa 70%);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.qwrap{perspective:1200px;width:min(84vw,330px);aspect-ratio:3/4}
.qcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.45,0,.2,1)}
.qwrap.rise{animation:rise .65s cubic-bezier(.2,1.3,.4,1)}@keyframes rise{from{transform:perspective(600px) rotateX(55deg) scale(.55) translateY(40px);opacity:.4}}
.qcard:not(.flip) .qback{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 60px #ffb020cc}}
.qcard.flip{animation:lift 1.6s ease-in-out}@keyframes lift{40%{scale:1.08}}
.tap{margin-top:18px;color:var(--g);font-size:17px;font-weight:700;animation:nud 1.4s infinite}@keyframes nud{50%{transform:translateY(5px)}}
.c{transition:opacity .35s,transform .35s}
.qcard.flip{transform:rotateY(180deg)}
.qf{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.qback{border:4px solid #fff}
.qfront{background:#fffaf0;color:#221d14;transform:rotateY(180deg);font-size:25px;font-weight:800;line-height:1.55;box-shadow:0 0 60px #ffb020aa}
.qfront small{position:absolute;top:18px;font-size:14px;color:#d97706}.qfront .no{position:absolute;bottom:18px;font-size:13px;color:#aaa}
.ov .row{width:100%;max-width:400px;margin-top:22px}
/* pocket */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#1a1814;border-radius:28px 28px 0 0;border-top:1px solid #ffffff22;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);z-index:12;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 4px;font-size:22px}.sheet p{margin:0 0 14px;opacity:.6;font-size:14px}
.it{display:flex;gap:12px;align-items:center;background:#ffffff0d;border:1px solid #ffffff14;border-radius:16px;padding:12px;margin-bottom:10px;font-size:16px;line-height:1.45}
.it .m{flex:none;width:40px;height:54px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px}
.dim{position:fixed;inset:0;background:#0009;z-index:11}
.conf{position:fixed;top:45%;left:50%;font-size:22px;pointer-events:none;animation:boom 1.1s ease-out forwards;z-index:20}
@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}

/* ===== ink style v4 ===== */
:root{--ink:#111;--paper:#f6f1e7;--g:#ffb020}
body{color:var(--ink);background:var(--paper);font-family:"Avenir Next",-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
h1{font-weight:900;letter-spacing:1px}
h1::before,h1::after{content:"✦";font-size:.6em;margin:0 10px;vertical-align:middle}
h2{opacity:1;font-weight:900;letter-spacing:3px}
.sub{opacity:.7}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:26px}
.btn{background:var(--ink);color:#fff;border-radius:999px;border:2.5px solid var(--ink);box-shadow:0 0 26px #ffb02088;letter-spacing:2px}
.btn::before,.btn::after{content:"✦";font-size:.75em;margin:0 12px;opacity:.9}
.btn.sec{background:#fff;color:var(--ink);border:2.5px solid var(--ink);box-shadow:none}
.btn.sec::before,.btn.sec::after{content:none}
.stepper button{background:#fff;color:var(--ink);border:2.5px solid var(--ink)}
input,textarea{background:#fff;color:var(--ink);border:2px solid var(--ink)}
input::placeholder,textarea::placeholder{color:#0006}
.deck{background:#fff;border:2.5px solid var(--ink);color:var(--ink)}
.deck.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 24px #ffb020aa}
.ptr{border-top-color:var(--ink);filter:drop-shadow(0 0 6px #ffb020)}
.wrap::before{box-shadow:0 0 0 4px var(--ink),0 0 44px #ffb020aa}
.hub{background:#fff;border:3px solid var(--ink)}
.res b,.who b{color:var(--ink);background:linear-gradient(transparent 60%,#ffd76b 60%)}
.chip{background:#fff;border:2px solid var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 18px #ffb020aa}
.frame{border:2.5px dashed var(--ink);box-shadow:0 0 34px #ffb02099}
.c{background:#fffdf8!important;color:var(--ink);border:2.5px solid var(--ink);box-shadow:4px 6px 0 var(--ink)}
.c::before,.c::after{content:"✦";position:absolute;font-size:16px}.c::before{top:10px;left:12px}.c::after{bottom:10px;right:12px}
.c.mid{box-shadow:0 0 34px #ffb020cc,4px 6px 0 var(--ink)}
.cnt{opacity:.75}
.ov{background:#f6f1e7f5}
.qback{background:#fffdf8!important;color:var(--ink);border:3px solid var(--ink)}
.qfront{background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 60px #ffb020aa}
.qfront small{color:var(--ink);font-weight:900;letter-spacing:2px}
.tap{color:var(--ink)}
.sheet{background:var(--paper);border-top:2.5px solid var(--ink)}
.it{background:#fff;border:2px solid var(--ink)}
.it .m{background:#fff!important;border:2px solid var(--ink)}
.dim{background:#0006}
.sub[style*="--g"]{color:var(--ink)!important;opacity:.8!important}
</style></head><body>

<div id="setup" class="scr">
<div style="text-align:center;font-size:42px;margin-top:10px">🃏</div><h1>很高興認識你</h1><p class="sub" style="font-size:17px;letter-spacing:1px;color:var(--g);opacity:.9">Nice to meet you</p>
<h2>👥 人數與名字</h2>
<div class="panel"><div class="stepper"><button id="minus">−</button><span id="n">4</span><button id="plus">＋</button></div><div class="names" id="names"></div></div>
<h2>🎴 選個主題</h2><div class="decks" id="decks"></div>
<div id="customBox" class="hidden"><h2>✏️ 自訂題目（一行一題）</h2><textarea id="custom" rows="7" placeholder="貼上你的題目，一行一題"></textarea></div>
<button class="btn" id="start" style="margin-top:22px">開始 👉</button>
</div>

<div id="spin" class="scr hidden">
<h1 style="margin-top:30px">誰先開始？</h1><p class="sub">轉一下，看命運選中誰</p>
<div class="wrap"><div class="ptr"></div><svg id="wheel" viewBox="-160 -160 320 320"></svg><div class="hub">🎯</div></div>
<div class="res" id="res">👆 按下面的按鈕轉轉盤</div>
<button class="btn" id="spinBtn">轉！</button>
<button class="btn sec" id="spinBack">重新開始</button>
</div>

<div id="game" class="scr hidden">
<div class="top"><div style="font-size:34px">🃏</div><div class="who" id="who"></div><div class="sub" style="font-size:14px;margin-top:4px">左右滑動轉牌，點一下就抽</div></div>
<div class="chips" id="chips"></div>
<div class="stage" id="stage"><div class="frame"></div></div>
<div class="sub" style="margin-top:6px;font-size:15px;color:var(--g);opacity:.85">👆 點中間的牌抽卡</div>
<div class="cnt" id="cnt"></div>
<div class="row"><button class="btn sec" id="shuf">🔀 洗牌</button></div>
<button class="btn sec" id="back">🔄 重新開始</button>
</div>

<div id="ov" class="ov hidden">
<div class="qwrap"><div class="qcard" id="qcard"><div class="qf qback" id="qback"></div><div class="qf qfront"><small id="qtag"></small><div id="qtext"></div><div class="no" id="qno"></div></div></div></div>
<div class="tap" id="tap">👆 點一下翻開</div><div class="row hidden" id="qbtns"><button class="btn sec" id="skip">跳過</button><button class="btn" id="keep" style="flex:2">已回答 👉</button></div>
</div>
<div id="pocket" class="hidden"><div class="dim" id="pdim"></div><div class="sheet" id="psheet"></div></div>

<script>
const DECKS=__DECKS__;
const THEME={icebreak:['#f97316','#fbbf24'],acquaint:['#0ea5e9','#67e8f9'],friend:['#10b981','#a3e635'],close:['#eab308','#fde68a'],soulmate:['#e11d48','#fb7185'],custom:['#8b5cf6','#c4b5fd']};
const WC=['#f97316','#0ea5e9','#10b981','#e11d48','#8b5cf6','#eab308','#14b8a6','#ec4899','#6366f1','#84cc16','#f43f5e','#06b6d4'];
const KEY='topicCards.v3';
let S=Object.assign({n:4,names:[],deck:'icebreak',custom:''},JSON.parse(localStorage.getItem(KEY)||'{}'));
if(S.deck!=='custom'&&!DECKS.some(d=>d.id===S.deck))S.deck='icebreak';
let G=null; // {pile:[], total, player, pockets:[[{q,deck}]], drawn}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function show(id){['setup','spin','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function deckInfo(){const d=DECKS.find(x=>x.id===S.deck);return d?{emoji:d.emoji,name:d.name,short:d.name.replace(/（.*/,'')}:{emoji:'✏️',name:'自訂主題',short:'自訂'}}
function col(){return THEME[S.deck]||THEME.custom}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function name(i){return(S.names[i]||'').trim()||('朋友 '+(i+1))}
/* setup */
function renderNames(){const box=$('names');box.innerHTML='';for(let i=0;i<S.n;i++){const inp=document.createElement('input');inp.placeholder='朋友 '+(i+1);inp.value=S.names[i]||'';inp.oninput=()=>{S.names[i]=inp.value;save()};box.appendChild(inp)}$('n').textContent=S.n}
function renderDecks(){const box=$('decks');box.innerHTML='';[...DECKS.map(d=>{const m=d.name.match(/^(.*?)（(.*)）$/)||[0,d.name,''];return{id:d.id,html:'<b>'+d.emoji+'</b>'+m[1]+'<small>'+m[2]+'</small>'}}),{id:'custom',html:'<b>✏️</b>自訂主題<small>貼上自己的題目</small>'}].forEach(d=>{const el=document.createElement('div');el.className='deck'+(S.deck===d.id?' on':'');el.innerHTML=d.html;el.onclick=()=>{S.deck=d.id;save();renderDecks()};box.appendChild(el)});$('customBox').classList.toggle('hidden',S.deck!=='custom')}
$('minus').onclick=()=>{if(S.n>2){S.n--;save();renderNames()}};
$('plus').onclick=()=>{if(S.n<12){S.n++;save();renderNames()}};
$('custom').value=S.custom;$('custom').oninput=e=>{S.custom=e.target.value;save()};
function cards(){if(S.deck==='custom')return[...new Set(S.custom.split('\n').map(s=>s.trim()).filter(Boolean))];return DECKS.find(d=>d.id===S.deck).cards}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('start').onclick=()=>{if(!cards().length){alert('自訂主題還沒有題目喔');return}const c=cards();G={pile:shuffled(c),total:c.length,drawn:0,player:0,pockets:Array.from({length:S.n},()=>[])};pos=0;buildWheel();show('spin')};
/* wheel */
let wheelRot=0,spinning=false;
function buildWheel(){const n=S.n,R=155;let g='';for(let i=0;i<n;i++){const a0=i/n*360-90,a1=(i+1)/n*360-90,r0=a0*Math.PI/180,r1=a1*Math.PI/180,am=(a0+a1)/2;
g+=`<path d="M0 0L${R*Math.cos(r0)} ${R*Math.sin(r0)}A${R} ${R} 0 ${n<2?1:0} 1 ${R*Math.cos(r1)} ${R*Math.sin(r1)}Z" fill="${(n%2&&i==n-1)?'#ffd76b':i%2?'#111':'#fffdf8'}" stroke="#111" stroke-width="3"/>`;
const fs=n>8?14:n>5?17:21;g+=`<text transform="rotate(${am}) translate(${R*0.62} 0)" fill="${(i%2&&!(n%2&&i==n-1))?'#fff':'#111'}" font-size="${fs}" font-weight="800" text-anchor="middle" dominant-baseline="middle">${esc(name(i).slice(0,6))}</text>`}
$('wheel').innerHTML='<g id="wg">'+g+'</g>';wheelRot=0;$('res').innerHTML='👆 按下面的按鈕轉轉盤';$('spinBtn').textContent='轉！';spinning=false;$('spinBtn').dataset.done=''}
$('spinBtn').onclick=()=>{if(spinning)return;if($('spinBtn').dataset.done){startGame();return}
spinning=true;const n=S.n,win=Math.floor(Math.random()*n);const seg=360/n;const center=(win+.5)*seg;const jitter=(Math.random()-.5)*seg*.7;
const target=360*6+(360-center)+jitter;const t0=performance.now(),D=2250;const st=()=>{const k=Math.min(1,(performance.now()-t0)/D),e=1-Math.pow(1-k,4);$('wg').setAttribute('transform','rotate('+(target*e)+')');if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st);$('res').textContent='轉啊轉…';
tick(4500);setTimeout(()=>{spinning=false;G.player=win;$('res').innerHTML='🎉 由 <b>'+esc(name(win))+'</b> 先開始！';$('spinBtn').textContent='開始抽卡 👉';$('spinBtn').dataset.done='1';confetti()},2350)};
function tick(ms){if(navigator.vibrate){let t=0;const f=()=>{if(t>ms)return;navigator.vibrate(5);t+=60+t/10;setTimeout(f,60+t/10)};f()}}
$('spinBack').onclick=()=>show('setup');
/* game */
let pos=0,vel=0,dragging=false,anim=null;
function startGame(){show('game');renderGame()}
function remaining(){return G.pile.length}
function renderGame(){const i=deckInfo();$('who').innerHTML='輪到 <b>'+esc(name(G.player))+'</b>';
$('chips').innerHTML=G.pockets.map((p,k)=>`<div class="chip${k===G.player?' on':''}" data-k="${k}">${esc(name(k))}<i>🗂️${p.length}</i></div>`).join('');
[...$('chips').children].forEach(el=>el.onclick=()=>openPocket(+el.dataset.k));
const on=$('chips').querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
$('cnt').textContent='剩 '+remaining()+' / '+G.total+' 張';draw3d()}
function draw3d(){const st=$('stage');st.querySelectorAll('.c').forEach(e=>e.remove());const n=remaining();if(!n){const e=document.createElement('div');e.className='c';e.style.background='#ffffff10';e.innerHTML='<div class=e>🎉</div><div class=n>抽完了</div><div class=s>按洗牌或重新開始</div>';st.appendChild(e);return}
const [a,b]=col(),i=deckInfo();const base=Math.round(pos);const items=[];
for(let o=-2;o<=2;o++){const idx=((base+o)%n+n)%n;if(n<7&&Math.abs(o)>Math.floor((n-1)/2)+(o>0&&n%2===0?1:0))continue;items.push([base+o-pos,idx])}
items.sort((x,y)=>Math.abs(y[0])-Math.abs(x[0])).forEach(([d,idx])=>{const e=document.createElement('div');e.className='c';e.style.background=`linear-gradient(150deg,${a},${b})`;e.innerHTML=`<div class=e>${i.emoji}</div><div class=n>話題卡</div><div class=s>${esc(i.short)}</div>`;
const ad=Math.abs(d);if(ad<.5)e.classList.add('mid');e.style.transform=`perspective(900px) translateX(${d*120}px) translateZ(${-Math.min(ad,2.5)*120}px) rotateY(${Math.max(-60,Math.min(60,-d*35))}deg)`;e.style.opacity=Math.max(0,1-ad*.25);e.style.filter=`brightness(${1-ad*.22}) hue-rotate(${((idx%5)-2)*14}deg)`;e.style.zIndex=10-Math.round(ad);st.appendChild(e)})}
function settle(){cancelAnimationFrame(anim);const step=()=>{if(Math.abs(vel)>.002){pos+=vel;vel*=.93;draw3d();anim=requestAnimationFrame(step)}else{const t=Math.round(pos);const s2=()=>{pos+=(t-pos)*.25;if(Math.abs(t-pos)<.01){pos=t;draw3d();return}draw3d();anim=requestAnimationFrame(s2)};s2()}};step()}
(function(){const st=$('stage');let sx,sy,lx,lt,moved,mode;
st.addEventListener('pointerdown',e=>{if(!remaining())return;cancelAnimationFrame(anim);sx=lx=e.clientX;sy=e.clientY;lt=performance.now();moved=false;mode=null;vel=0;dragging=true;st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){mode='side';moved=true}
if(mode==='side'){const now=performance.now();const ddx=e.clientX-lx;pos-=ddx/120;vel=-ddx/120/Math.max(1,(now-lt)/16);lx=e.clientX;lt=now;draw3d()}
});
const end=e=>{if(!dragging)return;dragging=false;
if(!moved){pick();return}settle()};
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end)})();
let cur=null;
let busy=false;function pick(){if(!remaining()||busy)return;busy=true;$('stage').querySelectorAll('.c').forEach(e=>{if(e.classList.contains('mid')){e.style.transform='translateY(-10px) scale(1.15)'}else{const m=(e.style.transform.match(/translateX\((-?[\d.]+)px/)||[0,0])[1];e.style.transform='translateX('+(m*2.2)+'px) scale(.6)';e.style.opacity=0}});setTimeout(reveal,380)}
function reveal(){busy=false;const n=remaining();const idx=((Math.round(pos)%n)+n)%n;const q=G.pile.splice(idx,1)[0];G.drawn++;cur={q,deck:S.deck,no:G.drawn};
const [a,b]=col(),i=deckInfo();$('qback').style.background=`linear-gradient(150deg,${a},${b})`;$('qback').innerHTML=`<div style="font-size:70px">${i.emoji}</div><div style="font-size:22px;font-weight:800;margin-top:10px">話題卡</div>`;
$('qtag').textContent=i.emoji+' '+i.short;$('qtext').textContent=q;$('qno').textContent=esc(name(G.player))+' 抽到的第 '+(G.pockets[G.player].length+1)+' 張';
$('qcard').classList.remove('flip');$('tap').classList.remove('hidden');$('qbtns').classList.add('hidden');const w=document.querySelector('.qwrap');w.classList.remove('rise');void w.offsetWidth;w.classList.add('rise');$('ov').classList.remove('hidden');if(navigator.vibrate)navigator.vibrate(20)}
$('qcard').onclick=()=>{if($('qcard').classList.contains('flip'))return;$('qcard').classList.add('flip');$('tap').classList.add('hidden');if(navigator.vibrate)navigator.vibrate(15);setTimeout(()=>{confetti();$('qbtns').classList.remove('hidden')},1300)};
$('keep').onclick=()=>{G.pockets[G.player].push(cur);cur=null;$('ov').classList.add('hidden');G.player=(G.player+1)%S.n;renderGame()};
$('skip').onclick=()=>{if(cur){G.pile.splice(Math.floor(Math.random()*(G.pile.length+1)),0,cur.q);G.drawn--}cur=null;$('ov').classList.add('hidden');renderGame()};
$('shuf').onclick=()=>{G.pile=shuffled(G.pile);vel=(Math.random()>.5?1:-1)*(.6+Math.random()*.4);settle()};
$('back').onclick=()=>{if(!confirm('確定要重新開始嗎？這一局和大家的口袋會清空。'))return;show('setup')};
function openPocket(k){const p=G.pockets[k];const items=p.map(x=>{const d=DECKS.find(y=>y.id===x.deck);const c=THEME[x.deck]||THEME.custom;return`<div class=it><div class=m style="background:linear-gradient(150deg,${c[0]},${c[1]})">${d?d.emoji:'✏️'}</div><div>${esc(x.q)}</div></div>`}).join('')||'<p>還沒有收任何卡，輪到他就去抽一張吧！</p>';
$('psheet').innerHTML=`<h3>🗂️ ${esc(name(k))}的口袋</h3><p>收了 ${p.length} 張卡</p>${items}<button class="btn sec" id="pclose">關閉</button>`;$('pocket').classList.remove('hidden');$('pclose').onclick=closePocket}
function closePocket(){$('pocket').classList.add('hidden')}$('pdim').onclick=closePocket;
function confetti(){const e=['✨','🎉','💬','⭐','🎈'];for(let i=0;i<16;i++){const s=document.createElement('span');s.className='conf';s.textContent=e[i%5];s.style.setProperty('--x',(Math.random()*320-160)+'px');s.style.setProperty('--y',(Math.random()*-320-40)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}
renderNames();renderDecks();
</script></body></html>
