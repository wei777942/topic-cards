<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>話題抽卡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--a:#ff6b9d;--b:#ffb36b;--bg1:#1d1442;--bg2:#3b1f6e}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 70%);transition:background .5s;overflow-x:hidden}

@keyframes float{to{transform:translate(60px,80px) scale(1.2)}}
h1{text-align:center;margin:22px 0 2px;font-size:36px;font-weight:900;background:linear-gradient(90deg,#fff,var(--b));-webkit-background-clip:text;color:transparent}
h2{font-size:15px;letter-spacing:2px;margin:22px 0 10px;opacity:.75}
.panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:800;margin:10px 0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .12s}
.btn:active,.deck:active,.stepper button:active{transform:scale(.95)}

.stepper{display:flex;align-items:center;justify-content:center;gap:24px}
.stepper button{width:64px;height:64px;border-radius:50%;border:0;font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;transition:transform .12s}
.stepper span{font-size:44px;font-weight:900;min-width:60px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.deck:last-child:nth-child(odd){grid-column:span 2}
.hidden{display:none!important}

</div>
<div id="game" class="hidden">
<div id="turn"></div><div class="prog"><i id="bar"></i></div><div id="count"></div>
<div class="scene"><div class="card" id="card"><div class="face back"><div class="big" id="bigE">🃏</div><div>點一下翻牌</div></div><div class="face front"><div class="tag" id="tag"></div><div id="q"></div><div class="no" id="no"></div></div></div></div>
<button class="btn" id="next">下一位 👉</button>
<div class="row"><button class="btn sec" id="skip">跳過這題</button><button class="btn sec" id="shuffle">重新洗牌</button></div>
<button class="btn sec" id="back">回到設定</button>
</div>
